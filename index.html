<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>MinionBuddy</title>

  <link rel="stylesheet" href="/src/style.css" />
</head>

<body>

  <!-- ================= INTRO ================= -->

  <div id="introScreen" class="intro-screen">

    <video
      id="introVideo"
      class="intro-video"
      autoplay
      muted
      playsinline
    >
      <source
        src="/assets/minion/intro/MINIONBUDDY.mp4"
        type="video/mp4"
      />

      Your browser does not support video.
    </video>

    <button id="skipIntro" class="skip-button">
      Skip intro
    </button>

  </div>


  <!-- ================= USER SETUP ================= -->

  <div id="setupScreen" class="setup-screen hidden">

    <div class="setup-card">

      <div class="setup-emoji">🍌</div>

      <h1>Welcome to MinionBuddy!</h1>

      <p>
        Before we start, tell your little buddy about you.
      </p>

      <label for="sweetieName">
        What's your sweetie name?
      </label>

      <input
        id="sweetieName"
        type="text"
        maxlength="30"
        placeholder="Enter your name"
      />

      <label for="userAge">
        How old are you?
      </label>

      <input
        id="userAge"
        type="number"
        min="5"
        max="100"
        placeholder="Your age"
      />

      <button id="startButton">
        Let's Go! 🍌
      </button>

      <p id="setupError" class="error-message"></p>

    </div>

  </div>


  <!-- ================= MAIN APP ================= -->

  <main id="app" class="app hidden">

    <header class="header">

      <div class="logo">
        🍌 MINIONBUDDY
      </div>

      <div id="welcomeText" class="welcome-text">
        Your silly little AI buddy
      </div>

    </header>


    <!-- CHARACTER AREA -->

    <section class="character-section">

      <div id="moodLabel" class="mood-label">
        MOOD: JUST VIBING
      </div>

      <div class="character-box">

        <img
          id="characterImage"
          src="/assets/minion/idle.jpg"
          alt="MinionBuddy character"
        />

        <img
          id="thinkingAnimation"
          class="thinking-animation hidden"
          src="/assets/minion/animations/waiting.gif"
          alt="MinionBuddy thinking"
        />

      </div>

      <div id="statusText" class="status">
        Ready for you 🍌
      </div>

    </section>


    <!-- CHAT -->

    <section id="chat" class="chat">

      <div class="message bot-message">

        <strong>MinionBuddy:</strong>

        <span>
          Bello! Tell me what's happening! 🍌
        </span>

      </div>

    </section>


    <!-- MEME -->

    <section id="memeSection" class="meme-section hidden">

      <div class="meme-title">
        😂 YOUR MOOD MEME
      </div>

      <img
        id="memeImage"
        class="meme-image"
        alt="Mood meme"
      />

    </section>


    <!-- INPUT -->

    <section class="input-section">

      <textarea
        id="textInput"
        rows="2"
        maxlength="500"
        placeholder="Tell MinionBuddy something..."
      ></textarea>

      <button id="sendButton">
        SEND 🍌
      </button>

    </section>

    <footer>
      MinionBuddy • Your silly AI companion 💛
    </footer>

  </main>


  <script type="module" src="/src/main.js"></script>

</body>
</html>
